name: Build Cross-Platform Executables & Install Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-native-installers:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: apidacs-linux-x64
            installer_glob: dist-installers/*.deb
          - os: windows-latest
            artifact: apidacs-win-x64.exe
            installer_glob: dist-installers/*.exe
          - os: macos-latest
            artifact: apidacs-macos-arm64
            installer_glob: dist-installers/*.pkg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/build-cli.mjs
      - run: node scripts/build-sea.mjs
      - name: Build OS Install Package
        run: node scripts/build-installers.mjs
      - name: Smoke test native executable
        run: ./dist-executables/${{ matrix.artifact }} selftest
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-bundle
          path: |
            dist-executables/${{ matrix.artifact }}
            ${{ matrix.installer_glob }}
            dist-installers/apidacs-installer-1.0.0.zip
